name: build

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, "release/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # keep runs on main from cancelling each other; every other ref cancels its stale run
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# the jobs read the code (the release job asks for more itself)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

defaults:
  run:
    working-directory: Engine

jobs:
  changes:
    name: Changed files
    # The fast PR check only needs to run when code changed. A job skipped by `if` reports success, so the
    # required `CI` check still reports; a workflow skipped by `paths` would not. On push the
    # cheap output is "true": those refs must be checked, the full matrix is gated separately.
    if: |
      github.ref_type != 'tag' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # a PR reports whether it changed code; every other ref is checked in full (the full matrix is gated
      # separately, so a snapshot's docs-only change still builds the downloads)
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'
              - '!.github/CODEOWNERS'
              - '!.github/release.yml'

  # The one required check. It runs even when its jobs were skipped, and fails if any of them failed or
  # was cancelled: the fast `check` gates a PR and the merge queue, the full matrix only a snapshot or a manual run.
  ci-ok:
    name: CI
    if: always() && github.ref_type != 'tag'
    needs: [changes, check, windows, windows-server, windows-package, windows-tests, linux, server-headless]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs passed or were skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Done
        run: echo "every required job passed or was skipped"

  check:
    name: fmt, clippy, tests (Linux)
    needs: changes
    # The fast gate: every PR that changes code, the merge queue, snapshot pushes and manual runs. The full
    # Windows/Linux matrix is below and only runs on a deliberate `Snapshot …` push or a manual dispatch — never
    # on a PR or a merge-queue run.
    if: |
      github.ref_type != 'tag' &&
      (github.event_name == 'push' ||
       github.event_name == 'merge_group' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        needs.changes.outputs.code == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for Bevy
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libgtk-3-dev nasm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Engine
          # kept when the run fails too, so the next run builds on it
          cache-on-failure: true
          # PRs and queue runs restore the release cache but never write it
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # the movie decoder's sandbox probe and the targets that start it (feature `sandbox-probe`), which the workspace's
      # targets above leave out
      - run: cargo clippy -p ssx-movie --all-targets --features sandbox-probe -- -D warnings
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc
      - name: Bundled controller mappings (gilrs)
        run: cargo test --manifest-path vendor/gilrs-0.11.2/Cargo.toml --lib --locked
      # the movie decoder's sandbox on Linux (crates/ssx-movie/tests/sandbox.rs): its program read from outside while
      # it decodes the test card; each attempt of the probe stopped by the seccomp filter or its limits
      - name: The movie decoder's sandbox (Linux)
        run: cargo test -p ssx-movie --features sandbox-probe --test sandbox
      # ssx-core as the release programs build it: the workspace's tests turn its `dev-master` on, this run does not
      - run: cargo test -p ssx-core --lib

  # The three Windows jobs run side by side: the game's build and package, the dedicated server's, and the tests (the
  # movie decoder's sandbox, the crash-safe writes), which need neither build and report within minutes. In each job a
  # check runs when what it reads was built, whatever an earlier check said, so one run shows every failure.
  windows:
    name: Windows build (launcher + game)
    if: |
      github.ref_type != 'tag' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Snapshot ')))
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # rav1d's assembly (the mod movies' AV1 decoder, decision M-D9) is assembled by NASM
      - name: NASM
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Engine
          # kept when the run fails too, so the next run builds on it
          cache-on-failure: true
      # ssx-movie: the movie decoder's program `avalanche-movie`, which the game starts from beside itself for a mod's
      # movie (its sandbox probe needs the feature `sandbox-probe` and is not built here)
      - name: Build
        id: build
        run: cargo build --release -p avalanche-game -p avalanche-launcher -p ssx-movie
      # the C runtime is linked statically (Engine/.cargo/config.toml): no program may import the Visual C++ runtime's
      # DLLs (vcruntime140, msvcp140) or the Universal CRT's (ucrtbase, api-ms-win-crt-*)
      - name: No C runtime DLLs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          rustup component add llvm-tools
          $objdump = Join-Path (rustc --print sysroot) "lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-objdump.exe"
          # (llvm-objdump for the later steps too)
          Split-Path $objdump | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $found = @()
          foreach ($exe in "project-avalanche", "avalanche-game", "avalanche-movie") {
            $dlls = & $objdump -p "target/release/$exe.exe" | Select-String "DLL Name:" |
              ForEach-Object { ($_.Line -split "DLL Name:")[1].Trim() }
            if ($LASTEXITCODE -ne 0 -or -not $dlls) { "llvm-objdump read no imports of $exe.exe"; exit 1 }
            "$exe.exe imports: $($dlls -join ', ')"
            $found += $dlls | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt-)' } |
              ForEach-Object { "$exe.exe imports $_" }
          }
          if ($found) { $found; exit 1 }
      # the decoder's process loads no window library (win32k is off from its creation; user32 and gdi32 would need
      # it): the shipped program imports only these system DLLs (run 42479494218: kernel32, the synchronisation API set
      # and ntdll; link.exe drops what std's unused parts name) and carries none of the sandbox probe's attempts
      - name: The movie decoder's imports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          allowed="kernel32.dll ntdll.dll bcryptprimitives.dll api-ms-win-core-synch-l1-2-0.dll"
          failed=0
          check() {
            local exe=$1 extra=$2 dlls dll
            dlls=$(llvm-objdump -p "$exe" | sed -n 's/^ *DLL Name: *//p' | tr -d '\r') || dlls=
            if [ -z "$dlls" ]; then echo "llvm-objdump read no imports of $exe"; failed=1; return; fi
            echo "$exe imports: $(echo "$dlls" | paste -sd, - | sed 's/,/, /g')"
            for dll in $dlls; do
              case " $allowed $extra " in
                *" ${dll,,} "*) ;;
                *) echo "$exe imports $dll, which the movie decoder's process must not load"; failed=1 ;;
              esac
            done
          }
          check target/release/avalanche-movie.exe ""
          if grep -aq "NOT STOPPED" target/release/avalanche-movie.exe; then
            echo "target/release/avalanche-movie.exe carries the sandbox probe's attempts"; failed=1
          fi
          exit $failed
      # the master is fixed in every release program: the development switch (ssx-core's `dev-master`, which the crates'
      # tests and examples turn on) is in neither their builds' features nor their binaries
      - name: No development master in the release programs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          if cargo tree -e features,normal,build -p avalanche-game -p avalanche-launcher -p ssx-movie | grep -q dev-master; then
            echo "a release program's build turns on ssx-core/dev-master"; exit 1
          fi
          for exe in project-avalanche avalanche-game avalanche-movie; do
            if grep -aq SSX_DEV_MASTER "target/release/$exe.exe"; then echo "$exe.exe carries the development master's switch"; exit 1; fi
          done
      - name: Package
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $dist = "../dist/ProjectAvalanche"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item target/release/project-avalanche.exe "$dist/Project Avalanche.exe"
          Copy-Item target/release/avalanche-game.exe "$dist/avalanche-game.exe"
          Copy-Item target/release/avalanche-movie.exe "$dist/avalanche-movie.exe"
          # avalanche-server.exe is built by the dedicated server's job; "Windows package" puts it beside these
          Copy-Item assets/THIRD_PARTY_NOTICES.txt "$dist/THIRD_PARTY_NOTICES.txt"
          Copy-Item assets/server/THIRD_PARTY_NOTICES.txt "$dist/THIRD_PARTY_NOTICES-server.txt"
          # the fallback fonts, one copy for the game and the launcher (each file checked against the manifest the
          # programs carry); a test keeps assets/fonts to exactly the set, its license and its manifest
          New-Item -ItemType Directory -Force -Path "$dist/fonts" | Out-Null
          Copy-Item assets/fonts/* "$dist/fonts/"
          @"
          Project Avalanche — native PC port of SSX (2012), test build $env:GITHUB_SHA

          1. Start "Project Avalanche.exe" (keep "avalanche-game.exe", "avalanche-movie.exe" and the
             "fonts" folder in the same folder: the game, which the launcher starts; the movie
             decoder, which the game starts in a sandbox of its own for a mod's movie; the fonts,
             which both draw names and chat in other scripts with).
          2. Click the large SET UP GAME DATA tile, select your own SSX (2012) Xbox 360 ISO once
             and click Extract game data; the launcher unpacks the game data
             (about 4.7 GB) into %LOCALAPPDATA%\Project Avalanche\GameData. A folder made by an
             earlier build has no movies: the launcher says so and adds them (select the ISO again).
          3. Click the large PLAY SSX (2012) tile. The game starts in its own window: the boot
             movies, the main menu, World Tour and Explore, the drops, the results. Progress is
             saved to %LOCALAPPDATA%\Project Avalanche\Saves\ssxvprofile.

          Controls: an Xbox-style gamepad with the game's own layout (recommended), or the keyboard.
            In the menus:    Enter = START, Space = A, Backspace = B, X, Y, arrow keys = D-pad,
                             Q / E = LB / RB, W A S D = left stick (the globe), F1 skips a movie.
            On the mountain: arrow keys or W A S D = left stick (steer, tuck, brake), Space = A (jump),
                             I / J / L / K = Y / X / B / A, Shift = RT, Ctrl = LT, E = RB,
                             Backspace = LB (rewind), Esc = START (pause).

          HOST starts a multiplayer server on this computer (avalanche-server.exe, next to the launcher; its
          licences are THIRD_PARTY_NOTICES-server.txt) and joins it with the game.

          Extras, Tools starts the asset viewer or a test ride on a single track: development tools,
          not the game and not in this download (asset-viewer.exe, built from the source, next to
          the launcher). If a start fails, its output is shown under Extras, Output and kept in
          %LOCALAPPDATA%\Project Avalanche\game.log (the tools': asset-viewer.log).

          No game data is included in this download.
          "@ | Set-Content -Encoding utf8 "$dist/README.txt"
      # for "Windows package" only (not a download: it has no server; kept a day)
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: windows-game-programs
          path: dist/ProjectAvalanche
          if-no-files-found: error
          retention-days: 1

  windows-server:
    name: Windows dedicated server
    if: |
      github.ref_type != 'tag' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Snapshot ')))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Engine
          # kept when the run fails too, so the next run builds on it
          cache-on-failure: true
      # its own job and cargo invocation: the game's and the launcher's features stay resolved as without the server
      - name: Build the dedicated server
        id: build
        run: cargo build --release -p avalanche-server
      # the C runtime is linked statically (Engine/.cargo/config.toml), as in the game's job
      - name: No C runtime DLLs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          rustup component add llvm-tools
          $objdump = Join-Path (rustc --print sysroot) "lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-objdump.exe"
          $found = @()
          foreach ($exe in "avalanche-server") {
            $dlls = & $objdump -p "target/release/$exe.exe" | Select-String "DLL Name:" |
              ForEach-Object { ($_.Line -split "DLL Name:")[1].Trim() }
            if ($LASTEXITCODE -ne 0 -or -not $dlls) { "llvm-objdump read no imports of $exe.exe"; exit 1 }
            "$exe.exe imports: $($dlls -join ', ')"
            $found += $dlls | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt-)' } |
              ForEach-Object { "$exe.exe imports $_" }
          }
          if ($found) { $found; exit 1 }
      # the master is fixed in the server too (as in the game's job)
      - name: No development master in the server
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          if cargo tree -e features,normal,build -p avalanche-server | grep -q dev-master; then
            echo "the server's build turns on ssx-core/dev-master"; exit 1
          fi
          if grep -aq SSX_DEV_MASTER target/release/avalanche-server.exe; then echo "avalanche-server.exe carries the development master's switch"; exit 1; fi
      - name: Package the dedicated server
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $dist = "../dist/ProjectAvalancheServer"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item target/release/avalanche-server.exe "$dist/avalanche-server.exe"
          Copy-Item assets/server/THIRD_PARTY_NOTICES.txt "$dist/THIRD_PARTY_NOTICES.txt"
          Copy-Item assets/server/deploy/server.toml.example "$dist/server.toml.example"
          Copy-Item assets/server/deploy/windows-service.txt "$dist/windows-service.txt"
          @"
          Project Avalanche dedicated server, test build $env:GITHUB_SHA

          1. Take the rules from your own SSX (2012) disc image once (21 MB of it; nothing else of the disc):
               .\avalanche-server.exe setup D:\path\to\your\ssx.iso --out data
          2. Copy server.toml.example to server.toml and edit it, then check everything:
               .\avalanche-server.exe check
          3. Run it in a console: .\avalanche-server.exe   (windows-service.txt: as a Windows service)

          It listens on port 27450, UDP for the game and TCP for the join, and the UDP query on 27451: open them
          in the firewall. "::" in server.toml listens on IPv6 and IPv4. [port_mapping] enabled = true maps the
          ports on your router (UPnP IGD, PCP, NAT-PMP; off by default). The first start makes the server's keys
          in data\ (netcode.key, identity.key): keep them; players' games remember the identity key and refuse a
          server whose key changed. The log is data\logs\server.log.

          Console: status, instances, say <text>, kick <rider> [reason], stop; start / stop / restart / ensure
          <resource>, refresh, blocklists, scripts; ban, unban, bans, mute, unmute, mutes, acl, aclrequest.
          help lists each with its arguments.
          Ctrl-C (or closing the console) stops it gracefully; a second Ctrl-C ends it at once.

          No game data is included: setup reads your own disc image.
          "@ | Set-Content -Encoding utf8 "$dist/README.txt"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: ProjectAvalanche-server-windows-x64
          path: dist/ProjectAvalancheServer
          if-no-files-found: error

  # The game's Windows download: the game's job's programs and the dedicated server's job's avalanche-server.exe (the
  # launcher's HOST starts it), each built once; it runs when both have passed.
  windows-package:
    name: Windows package (game + its server)
    if: |
      github.ref_type != 'tag' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Snapshot ')))
    needs: [windows, windows-server]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-game-programs
          path: dist/ProjectAvalanche
      - uses: actions/download-artifact@v8
        with:
          name: ProjectAvalanche-server-windows-x64
          path: server
      - name: The server beside the launcher
        run: |
          cp server/avalanche-server.exe dist/ProjectAvalanche/avalanche-server.exe
          for f in "Project Avalanche.exe" avalanche-game.exe avalanche-movie.exe avalanche-server.exe \
              THIRD_PARTY_NOTICES.txt THIRD_PARTY_NOTICES-server.txt README.txt fonts; do
            if [ ! -e "dist/ProjectAvalanche/$f" ]; then echo "the package has no $f"; exit 1; fi
          done
          ls -l dist/ProjectAvalanche
      - uses: actions/upload-artifact@v7
        with:
          name: ProjectAvalanche-windows-x64
          path: dist/ProjectAvalanche
          if-no-files-found: error

  windows-tests:
    name: Windows tests (movie decoder's sandbox, crash-safe writes)
    if: |
      github.ref_type != 'tag' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Snapshot ')))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # rav1d's assembly (the mod movies' AV1 decoder, decision M-D9) is assembled by NASM
      - name: NASM
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Engine
          # kept when the run fails too, so the next run builds on it
          cache-on-failure: true
      - name: llvm-objdump
        shell: pwsh
        run: |
          rustup component add llvm-tools
          $objdump = Join-Path (rustc --print sysroot) "lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-objdump.exe"
          Split-Path $objdump | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # the sandbox proof's probe and the decoder's program it runs beside (this job builds nothing that is shipped)
      - name: Build the movie decoder's sandbox probe
        id: probe
        run: cargo build --release -p ssx-movie --features sandbox-probe --bins
      # the programs the sandbox proof starts import only these system DLLs (as the shipped one, checked in the game's
      # job), the probe Winsock besides (its connect attempt)
      - name: The sandbox proof's imports
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        shell: bash
        run: |
          allowed="kernel32.dll ntdll.dll bcryptprimitives.dll api-ms-win-core-synch-l1-2-0.dll"
          failed=0
          check() {
            local exe=$1 extra=$2 dlls dll
            dlls=$(llvm-objdump -p "$exe" | sed -n 's/^ *DLL Name: *//p' | tr -d '\r') || dlls=
            if [ -z "$dlls" ]; then echo "llvm-objdump read no imports of $exe"; failed=1; return; fi
            echo "$exe imports: $(echo "$dlls" | paste -sd, - | sed 's/,/, /g')"
            for dll in $dlls; do
              case " $allowed $extra " in
                *" ${dll,,} "*) ;;
                *) echo "$exe imports $dll, which the movie decoder's process must not load"; failed=1 ;;
              esac
            done
          }
          check target/release/avalanche-movie.exe ""
          check target/release/avalanche-movie-probe.exe "ws2_32.dll"
          exit $failed
      # the movie decoder's sandbox run on Windows (crates/ssx-movie/tests/sandbox.rs): its program in its AppContainer,
      # its job, token and mitigation policies, read from outside while it decodes the test card; each attempt of the
      # probe refused or ended by the code of what stopped it
      - name: The movie decoder's sandbox
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        run: cargo test --release -p ssx-movie --features sandbox-probe --test sandbox
      # the crash-safe writes on Windows (crates/ssx-files): each step's failure leaving the old file, a crash's partial
      # file taken back and a live writer's left alone, writers in threads and in processes at once (the write-through
      # rename and, over an open file, the POSIX-semantics rename), a write inside a folder handle
      - name: Crash-safe file writes
        if: ${{ !cancelled() }}
        run: cargo test --release -p ssx-files --features cap-std

  linux:
    name: Linux build (launcher + game)
    if: |
      github.ref_type != 'tag' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Snapshot ')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for Bevy
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libgtk-3-dev nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Engine
          # kept when the run fails too, so the next run builds on it
          cache-on-failure: true
      # ssx-movie: the movie decoder's program `avalanche-movie` (as in the Windows job)
      - name: Build
        run: cargo build --release -p avalanche-game -p avalanche-launcher -p ssx-movie
      # its own cargo invocation: the game's and the launcher's features stay resolved as without the server
      - name: Build the dedicated server
        run: cargo build --release -p avalanche-server
      # the shipped movie decoder carries none of the sandbox probe's attempts (only the check job builds the probe)
      - name: The movie decoder is the shipped one
        run: |
          if grep -aq "NOT STOPPED" target/release/avalanche-movie; then
            echo "avalanche-movie carries the sandbox probe's attempts"; exit 1
          fi
      # the master is fixed in every release program: the development switch (ssx-core's `dev-master`, which the crates'
      # tests and examples turn on) is in neither their builds' features nor their binaries
      - name: No development master in the release programs
        shell: bash
        run: |
          if cargo tree -e features,normal,build -p avalanche-game -p avalanche-launcher -p ssx-movie -p avalanche-server | grep -q dev-master; then
            echo "a release program's build turns on ssx-core/dev-master"; exit 1
          fi
          for exe in project-avalanche avalanche-game avalanche-movie avalanche-server; do
            if grep -aq SSX_DEV_MASTER "target/release/$exe"; then echo "$exe carries the development master's switch"; exit 1; fi
          done
      - name: Package
        run: |
          dist=../dist/ProjectAvalanche
          mkdir -p "$dist"
          cp target/release/project-avalanche target/release/avalanche-game target/release/avalanche-movie \
            target/release/avalanche-server assets/THIRD_PARTY_NOTICES.txt "$dist/"
          cp assets/server/THIRD_PARTY_NOTICES.txt "$dist/THIRD_PARTY_NOTICES-server.txt"
          # the fallback fonts, one copy for the game and the launcher (each file checked against the manifest the
          # programs carry); a test keeps assets/fonts to exactly the set, its license and its manifest
          mkdir -p "$dist/fonts"
          cp assets/fonts/* "$dist/fonts/"
          cat > "$dist/README.txt" <<EOF
          Project Avalanche — native PC port of SSX (2012), test build $GITHUB_SHA

          1. Start ./project-avalanche (keep avalanche-game, avalanche-movie and the fonts folder in
             the same folder: the game, which the launcher starts; the movie decoder, which the game
             starts in a sandbox of its own for a mod's movie; the fonts, which both draw names and
             chat in other scripts with).
          2. Click the large SET UP GAME DATA tile, select your own SSX (2012) Xbox 360 ISO once
             and click Extract game data; the launcher unpacks the game data (about 4.7 GB) into
             ~/.local/share/project-avalanche/GameData (\$XDG_DATA_HOME/project-avalanche;
             PROJECT_AVALANCHE_HOME overrides it).
          3. Click the large PLAY SSX (2012) tile. The game starts in its own window. Progress is
             saved to ~/.local/share/project-avalanche/Saves/ssxvprofile.

          Needs: a GPU with a Vulkan driver, ALSA for sound (PipeWire and PulseAudio provide it),
          Wayland or X11, and the XDG desktop portal for the ISO file picker. Built on Ubuntu 24.04
          (x86-64): it runs on distributions with that glibc or newer.

          Controls: an Xbox-style gamepad with the game's own layout (recommended), or the keyboard.
            In the menus:    Enter = START, Space = A, Backspace = B, X, Y, arrow keys = D-pad,
                             Q / E = LB / RB, W A S D = left stick (the globe), F1 skips a movie.
            On the mountain: arrow keys or W A S D = left stick (steer, tuck, brake), Space = A (jump),
                             I / J / L / K = Y / X / B / A, Shift = RT, Ctrl = LT, E = RB,
                             Backspace = LB (rewind), Esc = START (pause).

          HOST starts a multiplayer server on this computer (avalanche-server, next to the launcher; its licences
          are THIRD_PARTY_NOTICES-server.txt) and joins it with the game.

          If a start fails, its output is shown under Extras, Output and kept in
          ~/.local/share/project-avalanche/game.log.

          No game data is included in this download.
          EOF
          # without a top-level folder, as the Windows updater's archive: the launcher 0.2.0's updater takes a file
          # at most one folder deep and refuses the archive for a deeper one (ProjectAvalanche/fonts/…), while it
          # skips ./fonts/… as a name it does not replace
          tar -C "$dist" -czf ../dist/ProjectAvalanche-linux-x64.tar.gz .
      # The tarball keeps the executable bits, which an artifact's zip would drop.
      - uses: actions/upload-artifact@v7
        with:
          name: ProjectAvalanche-linux-x64
          path: dist/ProjectAvalanche-linux-x64.tar.gz
          if-no-files-found: error
      - name: Package the dedicated server
        run: |
          dist=../dist/ProjectAvalancheServer
          mkdir -p "$dist"
          cp target/release/avalanche-server "$dist/"
          cp assets/server/THIRD_PARTY_NOTICES.txt "$dist/"
          cp assets/server/deploy/server.toml.example assets/server/deploy/avalanche-server.service "$dist/"
          cat > "$dist/README.txt" <<EOF
          Project Avalanche dedicated server, test build $GITHUB_SHA

          1. Take the rules from your own SSX (2012) disc image once (21 MB of it; nothing else of the disc):
               ./avalanche-server setup /path/to/your/ssx.iso --out data
          2. Copy server.toml.example to server.toml and edit it, then check everything:
               ./avalanche-server check
          3. Run it in a terminal: ./avalanche-server   (avalanche-server.service: as a systemd service; the
             source repository's Engine/assets/server/deploy has a Docker example)

          It listens on port 27450, UDP for the game and TCP for the join, and the UDP query on 27451: open them
          in the firewall. "::" in server.toml listens on IPv6 and IPv4. [port_mapping] enabled = true maps the
          ports on your router (UPnP IGD, PCP, NAT-PMP; off by default). The first start makes the server's keys
          in data/ (netcode.key, identity.key, readable by the owner only): keep them; players' games remember
          the identity key and refuse a server whose key changed. The log is data/logs/server.log. It needs no
          GPU, sound, display or input libraries.

          Console: status, instances, say <text>, kick <rider> [reason], stop; start / stop / restart / ensure
          <resource>, refresh, blocklists, scripts; ban, unban, bans, mute, unmute, mutes, acl, aclrequest.
          help lists each with its arguments.
          SIGINT / SIGTERM stop it gracefully; a second signal ends it at once.

          No game data is included: setup reads your own disc image.
          EOF
          tar -C ../dist -czf ../dist/ProjectAvalanche-server-linux-x64.tar.gz ProjectAvalancheServer
      - uses: actions/upload-artifact@v7
        with:
          name: ProjectAvalanche-server-linux-x64
          path: dist/ProjectAvalanche-server-linux-x64.tar.gz
          if-no-files-found: error

  server-headless:
    name: Server without desktop packages (Linux)
    if: |
      github.ref_type != 'tag' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Snapshot ')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # a bare Ubuntu: no ALSA, udev, Wayland, xkbcommon, GTK or X11 development packages (the check job installs them)
    container: ubuntu:24.04
    steps:
      - name: The compilers and rustup, nothing else
        working-directory: /
        # g++: the server's script host builds Luau from its C++ source (mlua-sys)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gcc g++ libc6-dev git
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --release -p avalanche-server
      - name: No development master in the server
        run: |
          if cargo tree -e features,normal,build -p avalanche-server | grep -q dev-master; then
            echo "the server's build turns on ssx-core/dev-master"; exit 1
          fi
          if grep -aq SSX_DEV_MASTER target/release/avalanche-server; then echo "the server carries the development master's switch"; exit 1; fi
      - name: No desktop library in the build or the binary
        run: |
          if cargo tree -p avalanche-server -e normal --prefix none | grep -E '^(alsa(-sys)?|libudev(-sys)?|wayland-[a-z_-]+|x11[a-z_-]*|xkbcommon[a-z_-]*|gilrs[a-z_-]*|winit|wgpu[a-z_-]*|naga|ash|cpal|rodio|bevy_(render|winit|window|audio|gilrs)) v'; then
            echo "the server's build names a desktop library"; exit 1
          fi
          ldd target/release/avalanche-server
          # libstdc++: Luau's C++ runtime (the server's scripts); part of every Linux base system
          if ldd target/release/avalanche-server | grep -vE 'linux-vdso|libc\.so|libm\.so|libgcc_s\.so|libstdc\+\+\.so|ld-linux'; then
            echo "the server links a library beyond libc, libm, libgcc_s and libstdc++"; exit 1
          fi
          # without the rules data (no disc on a runner) the check must run, find the folder empty and say so
          set +e
          target/release/avalanche-server check --config none.toml --data empty-data > check.txt 2>&1
          code=$?
          set -e
          cat check.txt
          if [ "$code" -ne 2 ] || ! grep -q "no rules data yet" check.txt; then
            echo "the check did not run as expected (exit $code)"; exit 1
          fi

  # A tag builds nothing: it releases the downloads its snapshot commit's run built and checked, the same
  # files (the building jobs above skip a tag). Tag the `Snapshot …` commit (on the release branch); its push
  # run ran the full matrix, and the artifacts are downloaded from it.
  release:
    name: Release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: The snapshot commit's full run
        id: snapshot_run
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the commit the tag names (an annotated tag's object is not the commit)
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF" --jq .sha)
          subject=$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit" --jq .commit.message | head -1)
          case "$subject" in
            "Snapshot "*) ;;
            *)
              echo "$GITHUB_REF_NAME names $commit, whose subject is not \"Snapshot …\": tag a snapshot commit"
              exit 1
              ;;
          esac
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          # no branch filter: the snapshot's full run is on the release branch (or main after the release merge)
          query="head_sha=$commit&event=push&status=success&per_page=1"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?$query" --jq '.workflow_runs[0].id // empty')
          if [ -z "$run" ]; then
            echo "$GITHUB_REF_NAME names $commit, which has no successful push run (the snapshot's full matrix):"
            echo "let the snapshot's run on the release branch finish green, then tag that commit"
            exit 1
          fi
          echo "$GITHUB_REF_NAME names $commit: releasing the packages of its full run, $run"
          echo "($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run)"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      # the downloads (each in dist/<name>/), not the game's job's programs for "Windows package"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: ProjectAvalanche-*
          run-id: ${{ steps.snapshot_run.outputs.run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          digest-mismatch: error
      - name: Release
        working-directory: dist
        run: |
          (cd ProjectAvalanche-windows-x64 && zip -r ../ProjectAvalanche-windows-x64.zip .)
          # The launcher's updater downloads the tar.gz (the zip is for a manual install).
          tar -C ProjectAvalanche-windows-x64 -czf ProjectAvalanche-windows-x64.tar.gz .
          (cd ProjectAvalanche-server-windows-x64 && zip -r ../ProjectAvalanche-server-windows-x64.zip .)
          cat > downloads.md <<'EOF'
          ## Downloads

          - **Windows (x64):** `ProjectAvalanche-windows-x64.zip`. Unpack it anywhere and start `Project Avalanche.exe`.
            (`ProjectAvalanche-windows-x64.tar.gz` holds the same files for the launcher's updater.)
          - **Linux (x64):** `ProjectAvalanche-linux-x64.tar.gz`. Unpack it into a folder of its own
            (`mkdir ProjectAvalanche && tar -xzf ProjectAvalanche-linux-x64.tar.gz -C ProjectAvalanche`) and start
            `./project-avalanche`. Built on Ubuntu 24.04; it needs a Vulkan driver and that glibc or newer.
          - **Dedicated server:** `ProjectAvalanche-server-windows-x64.zip` and `ProjectAvalanche-server-linux-x64.tar.gz`:
            `avalanche-server`, headless (no GPU, sound or display), port 27450 UDP and TCP and 27451 UDP; it takes the
            rules from your own disc image (`setup`), and its README.txt says how to run it (a systemd unit and a Windows
            service note inside). The game's downloads carry it too, for the launcher's HOST.

          The launcher, `avalanche-game`, `avalanche-movie` and the `fonts` folder must stay in the same folder. You
          need your own copy of the game: the launcher sets the game data up from an ISO image of your retail Xbox 360
          disc of SSX (2012), and no game data is included. The port is a work in progress; the README says what runs and how to report problems.
          EOF
          gh release create "$GITHUB_REF_NAME" ProjectAvalanche-windows-x64.zip \
            ProjectAvalanche-windows-x64.tar.gz \
            ProjectAvalanche-linux-x64/ProjectAvalanche-linux-x64.tar.gz \
            ProjectAvalanche-server-windows-x64.zip \
            ProjectAvalanche-server-linux-x64/ProjectAvalanche-server-linux-x64.tar.gz \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "$(cat downloads.md)" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
